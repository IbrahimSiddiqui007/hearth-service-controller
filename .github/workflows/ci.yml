name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  mocked-backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Prepare test output directory
        run: python -c "from pathlib import Path; Path('.cache').mkdir(exist_ok=True)"
      - run: python -m pytest --basetemp=.cache/ci-tests --junitxml=.cache/backend.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mocked-results-${{ matrix.os }}
          path: .cache/backend.xml
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:pwa
      - run: npm run test:appearance
